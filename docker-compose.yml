services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: dovetail
      POSTGRES_PASSWORD: dovetail
      POSTGRES_DB: dovetailclone
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dovetail -d dovetailclone"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://dovetail:dovetail@postgres:5432/dovetailclone?schema=public"
      STORAGE_DRIVER: "local"
      STORAGE_LOCAL_DIR: ".data/uploads"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      ANTHROPIC_MODEL_TAGGING: "${ANTHROPIC_MODEL_TAGGING:-claude-haiku-4-5-20251001}"
      ANTHROPIC_MODEL_SUMMARIZE: "${ANTHROPIC_MODEL_SUMMARIZE:-claude-sonnet-5}"
      ASSEMBLYAI_API_KEY: "${ASSEMBLYAI_API_KEY:-}"
      VOYAGE_API_KEY: "${VOYAGE_API_KEY:-}"
      VOYAGE_MODEL_EMBED: "${VOYAGE_MODEL_EMBED:-voyage-4-lite}"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:-}"
      BETTER_AUTH_URL: "${BETTER_AUTH_URL:-http://localhost:3000}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      GITHUB_CLIENT_ID: "${GITHUB_CLIENT_ID:-}"
      GITHUB_CLIENT_SECRET: "${GITHUB_CLIENT_SECRET:-}"
    ports:
      - "3000:3000"
    volumes:
      - app-uploads:/app/.data

volumes:
  postgres-data:
  app-uploads:
